
<!DOCTYPE html>
<html>
  <head>
    <title>Job Answer Generator</title>
    <style>
      body { font-family: Arial; padding: 10px; width: 300px; }
      textarea { width: 100%; height: 100px; }
      button { margin-top: 10px; }
      #answer { margin-top: 10px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h3>Auto Answer Generator</h3>
    <textarea id="jobDesc" placeholder="Paste Job Description here..."></textarea>
    <button id="generateBtn">Generate Answer</button>
    <button id="copyBtn">Copy</button>
    <div id="answer"></div>
    <script src="popup.js"></script>
  </body>
</html>
